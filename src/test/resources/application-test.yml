spring:
  config:
    activate:
      on-profile: test
  datasource:
    writer:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:practice;MODE=MySQL
      username: sa
      password:
    reader:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:practice;MODE=MySQL
      username: sa
      password:
  jpa:
    defer-datasource-initialization: false
    h2:
      console:
        enabled: true
  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
